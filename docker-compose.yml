services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NUXT_DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NUXT_JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NUXT_JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "${APP_PORT:-3019}:3000"
    labels:
      # BillEngine injects BILLING_GATE_* env. Use @docker so Coolify attaches the chain.
      - "coolify.traefik.middlewares=${COOLIFY_RESOURCE_UUID}-billing-gate@docker"
      - "traefik.http.middlewares.${COOLIFY_RESOURCE_UUID}-billing-key.headers.customrequestheaders.X-Billing-Gate-Key=${BILLING_GATE_SHARED_KEY}"
      - "traefik.http.middlewares.${COOLIFY_RESOURCE_UUID}-billing-forward.forwardauth.address=${BILLING_GATE_INTERNAL_URL}"
      - "traefik.http.middlewares.${COOLIFY_RESOURCE_UUID}-billing-forward.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.${COOLIFY_RESOURCE_UUID}-billing-forward.forwardauth.preserveLocationHeader=true"
      - "traefik.http.middlewares.${COOLIFY_RESOURCE_UUID}-billing-forward.forwardauth.addAuthCookiesToResponse=billing_notice_ack"
      - "traefik.http.middlewares.${COOLIFY_RESOURCE_UUID}-billing-key-clear.headers.customrequestheaders.X-Billing-Gate-Key="
      - "traefik.http.middlewares.${COOLIFY_RESOURCE_UUID}-billing-gate.chain.middlewares=${COOLIFY_RESOURCE_UUID}-billing-key,${COOLIFY_RESOURCE_UUID}-billing-forward,${COOLIFY_RESOURCE_UUID}-billing-key-clear"
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

networks:
  coolify:
    external: true
